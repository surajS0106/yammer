name: CI

# Kept under 3 minutes to stay inside the free tier: one Linux job, no
# whisper.cpp/Tauri build. The desktop crate is tested locally with
# `cargo test --workspace`.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun --filter desktop build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Formats the whole workspace without compiling it, so larp is covered too.
      - run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
      # voice-core has no whisper.cpp, so skip the workspace's opt-level 3 for deps.
      - run: cargo clippy -p voice-core --all-targets --config 'profile.dev.package."*".opt-level=0' -- -D warnings
      - run: cargo test -p voice-core --config 'profile.dev.package."*".opt-level=0'
