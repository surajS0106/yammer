name: Release

# Manual only: building installers for every platform takes well over the
# 3-minute CI budget (and macOS minutes bill at 10x). Run it from the Actions
# tab when you actually want a GitHub release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    # The updater signing key lives in this environment, not the repo, and the environment only
    # admits runs from main (Settings → Environments → release).
    environment: release
    # Third-party actions run with the signing key in reach, so each is pinned to a commit, not a movable tag.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libasound2-dev libxdo-dev pkg-config cmake libclang-dev

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Pinned by commit, so the toolchain can't come from the ref name and is given explicitly.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - run: bun install --frozen-lockfile

      # macOS 26 swaps the app icon with the system appearance; needs Xcode's actool.
      # The script fails the job if Assets.car isn't produced, rather than shipping the static icon.
      # tauri.macos.conf.json (merged automatically on macOS) bundles it.
      - name: Compile adaptive macOS icon
        if: runner.os == 'macOS'
        run: apps/desktop/src-tauri/icons/build-mac-icon.sh

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles; tauri-action then merges every platform into the release's latest.json,
          # which the app's "Upgrade now" button reads. The public half is plugins.updater.pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Yammer ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: See the assets below to download the installer for your platform.
          releaseDraft: false
          prerelease: false
