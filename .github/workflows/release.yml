name: Release

# Manual only: building installers for every platform (and the Android APK) takes well over the
# 3-minute CI budget (and macOS minutes bill at 10x). Run it from the Actions
# tab when you actually want a GitHub release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    # The updater signing key lives in this environment, not the repo, and the environment only
    # admits runs from main (Settings → Environments → release).
    environment: release
    # Third-party actions run with the signing key in reach, so each is pinned to a commit, not a movable tag.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libasound2-dev libxdo-dev pkg-config cmake libclang-dev

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Pinned by commit, so the toolchain can't come from the ref name and is given explicitly.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      # This version's section of CHANGELOG.md becomes the release notes, which tauri-action also puts in
      # latest.json, where "Upgrade now" shows them. A release with no entry stops here.
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          notes=$(awk -v v="$version" '/^## /{on = index($0, "## " v " ") == 1; next} on' CHANGELOG.md)
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## $version — <date>' section. Rename Unreleased before releasing."
            exit 1
          fi
          { echo "body<<NOTES_EOF"; echo "$notes"; echo "NOTES_EOF"; } >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile

      # macOS 26 swaps the app icon with the system appearance; needs Xcode's actool.
      # The script fails the job if Assets.car isn't produced, rather than shipping the static icon.
      # tauri.macos.conf.json (merged automatically on macOS) bundles it.
      - name: Compile adaptive macOS icon
        if: runner.os == 'macOS'
        run: apps/desktop/src-tauri/icons/build-mac-icon.sh

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater bundles; tauri-action then merges every platform into the release's latest.json,
          # which the app's "Upgrade now" button reads. The public half is plugins.updater.pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Yammer ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

  # The phone build. It runs after the desktop jobs so the release (and its latest.json) already exists, then
  # adds a signed APK to it. The APK isn't an updater artifact: people reinstall it to update. The keystore is
  # permanent (losing it means installs can't update), so it's kept in the same `release` environment as the
  # updater key. Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
  android:
    needs: build
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: aarch64-linux-android

      - name: Set up the Android toolchain
        shell: bash
        run: |
          # The runner image ships JDK 17, the Android SDK and the NDK; use them rather than another action.
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile

      - name: Decode the signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set in the release environment, so the APK can't be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yammer-release.jks"

      - name: Build the APK
        shell: bash
        env:
          YAMMER_KEYSTORE_FILE: ${{ runner.temp }}/yammer-release.jks
          YAMMER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          YAMMER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YAMMER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # arm64 only, which is every current phone. tauri.local.conf.json turns off updater artifacts, since
        # Android has no updater and this job doesn't hold the updater signing key.
        run: bun --filter desktop tauri android build --apk --target aarch64 --config src-tauri/tauri.local.conf.json

      - name: Check the APK
        shell: bash
        run: |
          apk=apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          test -f "$apk" || { echo "::error::No signed release APK was produced (unsigned builds are named app-universal-release-unsigned.apk)."; ls -R "$(dirname "$apk")/.."; exit 1; }
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | grep -v rc | sort -V | tail -1)/apksigner verify --verbose --min-sdk-version 26 "$apk"
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          cp "$apk" "Yammer_${version}_android.apk"
          echo "APK_FILE=Yammer_${version}_android.apk" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The same tag the desktop jobs published to. --clobber lets a re-run replace the file.
      - name: Attach the APK to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v$VERSION"; fi
          gh release upload "$tag" "$APK_FILE" --clobber --repo "$GITHUB_REPOSITORY"
